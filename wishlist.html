<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wishlist | NADÉA PARFUM</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background: #fffaf8;
        }

        /* WISHLIST CONTAINER */

        .wishlist-container {
            max-width: 1150px;
            min-height: 550px;
            margin: 0 auto;
            padding: 75px 35px;
        }

        /* HEADING */

        .wishlist-heading {
            text-align: center;
            margin-bottom: 50px;
        }

        .wishlist-heading p {
            color: #b77b86;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }

        .wishlist-heading h1 {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 500;
            color: #553d42;
            margin-bottom: 12px;
        }

        .wishlist-heading span {
            color: #927c80;
            font-size: 13px;
        }

        /* WISHLIST GRID */

        .wishlist-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 28px;
        }

        .wishlist-card {
            background: white;
            padding: 13px 13px 22px;
            text-align: center;
            border: 1px solid #f0e2df;
            transition: 0.3s ease;
        }

        .wishlist-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 28px rgba(92, 53, 61, 0.10);
        }

        .wishlist-card img {
            display: block;
            width: 100%;
            height: 220px;
            object-fit: contain;
            background: #fffaf8;
            margin-bottom: 18px;
        }

        .wishlist-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 21px;
            font-weight: 500;
            color: #553d42;
            margin-bottom: 10px;
        }

        .wishlist-card p {
            color: #a66e78;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        /* BUTTONS */

        .wishlist-card button {
            padding: 11px 17px;
            border: 1px solid #b77b86;
            background: #b77b86;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: 0.3s ease;
            margin: 5px 2px;
        }

        .wishlist-card button:hover {
            background: #8e5d67;
            border-color: #8e5d67;
        }

        .wishlist-card .remove-wishlist {
            background: transparent;
            color: #a66e78;
        }

        .wishlist-card .remove-wishlist:hover {
            background: #f8e9e7;
            color: #8e5d67;
        }

        /* EMPTY WISHLIST */

        .empty-wishlist {
            grid-column: 1 / -1;
            text-align: center;
            padding: 65px 15px;
            background: #fff3f0;
        }

        .empty-wishlist h2 {
            font-family: 'Playfair Display', serif;
            color: #553d42;
            font-size: 26px;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .empty-wishlist p {
            color: #927c80;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .empty-wishlist a {
            display: inline-block;
            background: #b77b86;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            font-size: 11px;
            letter-spacing: 1px;
        }

        /* RESPONSIVE */

        @media (max-width: 850px) {
            .wishlist-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .wishlist-container {
                padding: 50px 15px;
            }

            .wishlist-heading h1 {
                font-size: 32px;
            }

            .wishlist-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
            }

            .wishlist-card {
                padding: 8px 8px 16px;
            }

            .wishlist-card img {
                height: 160px;
            }

            .wishlist-card h3 {
                font-size: 16px;
            }

            .wishlist-card button {
                width: 100%;
                margin: 4px 0;
                padding: 10px 5px;
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

    <div class="announcement">
        Discover Your Signature Scent ✨
    </div>

    <header class="navbar">
        <a href="index.html" class="logo">
            <img src="img/logo-nadea.png" alt="NADÉA PARFUM">
        </a>

        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="index.html#about">About Us</a>
            <a href="wishlist.html">Wishlist</a>
            <a href="cart.html">My Bag</a>
            <a href="checkout.html">Checkout</a>
            <a href="orders.html">My Orders</a>
        </nav>
    </header>

    <main class="wishlist-container">

        <section class="wishlist-heading">
            <p>YOUR PERSONAL COLLECTION</p>
            <h1>My Wishlist ♡</h1>
            <span>Keep the fragrances you love in one place.</span>
        </section>

        <div class="wishlist-grid" id="wishlist-items"></div>

    </main>

    <footer id="contact">
        <h2>NADÉA PARFUM</h2>
        <p>A Scent Called You.</p>
        <p>© 2026 NADÉA PARFUM. All Rights Reserved.</p>
    </footer>

    <script src="js/wishlist.js"></script>

</body>
</html>
